name: Build & Release

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub release with built binaries'
        required: false
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'

permissions:
  contents: write
  actions: read

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --no-pub

      - name: Extract version
        id: version
        run: |
          VERSION=$(flutter pub run --no-pub print --template='{version}' || \
            grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Build APK (release)
        run: flutter build apk --release -t lib/main.dart

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: animedives-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore

  build-aab:
    name: Build App Bundle
    runs-on: ubuntu-latest
    needs: build-apk
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Set up JRE 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build AAB (release)
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: animedives-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-apk, build-aab]
    # Always run on push to main, release publish, or manual dispatch.
    # On release publish events, upload to the existing release.
    # On other triggers, create a new release with version tag.
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Determine release tag
        id: release
        run: |
          # On a published release event, use the release tag.
          # Otherwise, derive from pubspec version (e.g. 1.6.9+1 -> v1.6.9).
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "name=AnimeDives ${{ github.event.release.name }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
            BASE=$(echo "$VERSION" | cut -d'+' -f1)
            echo "tag=v${BASE}" >> "$GITHUB_OUTPUT"
            echo "name=AnimeDives v${BASE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/animedives-apk/**
            ./artifacts/animedives-aab/**
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          generate_release_notes: true
          # On release published events, target the existing release tag.
          target_commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
